<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <title>Daymark — A little more focus</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8f5;
      --surface: #fff;
      --text: #20251f;
      --muted: #858b81;
      --line: #e9ece6;
      --accent: #527b5b;
      --accent-soft: #eaf1e9;
      --shadow: 0 18px 60px rgba(32, 45, 31, .055);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171b17;
        --surface: #202620;
        --text: #edf1eb;
        --muted: #9ba59a;
        --line: #343c34;
        --accent: #9ac39d;
        --accent-soft: #2b3b2d;
        --shadow: 0 18px 60px rgba(0, 0, 0, .18);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px 36px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app { width: min(100%, 480px); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 58px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: -.025em; }
    .brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 9px;
      background: var(--accent);
      color: var(--surface);
    }
    .brand-mark svg { width: 16px; height: 16px; }
    .date-chip { color: var(--muted); font-size: 13px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 38px); font-weight: 650; letter-spacing: -.055em; line-height: 1.12; }
    .subtitle { margin: 13px 0 29px; color: var(--muted); font-size: 15px; line-height: 1.55; }

    .add-form {
      display: flex;
      gap: 9px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color .2s, box-shadow .2s;
    }
    .add-form:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 11%, transparent), var(--shadow); }
    .add-form input { flex: 1; min-width: 0; padding: 10px 11px; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; }
    .add-form input::placeholder { color: #a4aaa1; }
    .add-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 15px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: filter .18s, transform .18s;
    }
    .add-button:hover { filter: brightness(1.07); }
    .add-button:active { transform: scale(.97); }
    .add-button svg { width: 15px; height: 15px; }

    .task-panel { margin-top: 28px; padding: 5px 21px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .list-heading { display: flex; align-items: center; justify-content: space-between; padding: 15px 0 12px; color: var(--muted); font-size: 12px; }
    .list-heading strong { color: var(--text); font-size: 13px; font-weight: 650; }
    .task-list { margin: 0; padding: 0; list-style: none; }
    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 62px;
      border-top: 1px solid var(--line);
      animation: arrive .32s cubic-bezier(.2,.8,.2,1) both;
    }
    .task.removing { overflow: hidden; min-height: 0; opacity: 0; transform: translateX(12px); transition: opacity .2s, transform .2s, min-height .22s .08s; }
    @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .check {
      display: grid;
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      place-items: center;
      padding: 0;
      border: 1.5px solid #cbd2c8;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s cubic-bezier(.2,.8,.2,1);
    }
    .check:hover { border-color: var(--accent); transform: scale(1.08); }
    .check svg { width: 12px; height: 12px; opacity: 0; transform: scale(.5); transition: opacity .16s, transform .22s cubic-bezier(.2,.8,.2,1); }
    .task.completed .check { border-color: var(--accent); background: var(--accent); transform: scale(1); }
    .task.completed .check svg { opacity: 1; transform: scale(1); }
    .task-label { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 1.45; transition: color .2s; }
    .task.completed .task-label { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 65%, transparent); }
    .delete-button {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity .16s, background .16s, color .16s;
    }
    .task:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { background: color-mix(in srgb, var(--muted) 12%, transparent); color: var(--text); }
    .delete-button svg { width: 16px; height: 16px; }
    .empty-state { display: none; padding: 32px 0; border-top: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 14px; }
    .empty-state.visible { display: block; }

    .list-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .filters { display: flex; gap: 3px; }
    .filter-button, .clear-button { padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
    .filter-button:hover, .clear-button:hover { color: var(--text); }
    .filter-button.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .clear-button { padding-right: 0; }
    .clear-button:disabled { cursor: default; opacity: .45; }
    .bottom-note { margin: 25px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .bottom-note span { color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    @media (max-width: 420px) {
      body { padding: 30px 17px; }
      .topbar { margin-bottom: 43px; }
      .task-panel { padding-right: 15px; padding-left: 15px; }
      .list-footer { gap: 5px; }
      .filter-button { padding-right: 6px; padding-left: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none"><path d="m5 10.2 3.1 3.1L15.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        daymark
      </div>
      <time class="date-chip" id="today"></time>
    </header>

    <section aria-labelledby="page-title">
      <p class="eyebrow">A fresh start, every day</p>
      <h1 id="page-title">Make room for<br>what matters.</h1>
      <p class="subtitle">A little progress is still progress. What's on your mind?</p>

      <form class="add-form" id="task-form">
        <input id="task-input" type="text" maxlength="180" placeholder="Add a task..." aria-label="New task" autocomplete="off">
        <button class="add-button" type="submit">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Add task
        </button>
      </form>

      <section class="task-panel" aria-label="Your tasks">
        <div class="list-heading"><strong>Today's focus</strong><span id="progress-label" aria-live="polite"></span></div>
        <ul class="task-list" id="task-list"></ul>
        <div class="empty-state" id="empty-state">Nothing here for now. Enjoy the breathing room.</div>
        <footer class="list-footer">
          <span id="remaining-label"></span>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
          </div>
          <button class="clear-button" id="clear-completed" type="button">Clear done</button>
        </footer>
      </section>
      <p class="bottom-note"><span>✳</span> Your list stays right here on this device.</p>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "daymark-tasks-v1";
      const examples = [
        { id: "example-1", text: "Take a proper lunch break", completed: false },
        { id: "example-2", text: "Send the project update", completed: false },
        { id: "example-3", text: "Pick up something fresh for dinner", completed: false }
      ];
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const emptyState = document.querySelector("#empty-state");
      const remainingLabel = document.querySelector("#remaining-label");
      const progressLabel = document.querySelector("#progress-label");
      const clearButton = document.querySelector("#clear-completed");
      let filter = "all";
      let tasks = loadTasks();

      function loadTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved === null) return examples;
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed) || !parsed.every(task =>
            task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean"
          )) throw new Error("Saved task data is invalid.");
          return parsed;
        } catch (error) {
          console.error("Unable to load saved tasks.", error);
          return examples;
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          console.error("Unable to save tasks to localStorage.", error);
        }
      }

      function render() {
        const visibleTasks = tasks.filter(task =>
          filter === "all" || (filter === "active" && !task.completed) || (filter === "completed" && task.completed)
        );
        list.replaceChildren();
        visibleTasks.forEach(task => {
          const item = document.createElement("li");
          item.className = `task${task.completed ? " completed" : ""}`;
          item.dataset.id = task.id;

          const check = document.createElement("button");
          check.type = "button";
          check.className = "check";
          check.setAttribute("aria-label", task.completed ? `Mark "${task.text}" active` : `Complete "${task.text}"`);
          check.setAttribute("aria-pressed", String(task.completed));
          check.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.2 2.8 2.7 6.2-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          check.addEventListener("click", () => toggleTask(task.id));

          const label = document.createElement("span");
          label.className = "task-label";
          label.textContent = task.text;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete-button";
          remove.setAttribute("aria-label", `Delete "${task.text}"`);
          remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 6h10m-8.5 0 .6 9h5.8l.6-9M8 6V4.5h4V6m-3 2.2v4.5m2-4.5v4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          remove.addEventListener("click", () => deleteTask(task.id, item));

          item.append(check, label, remove);
          list.append(item);
        });

        const completed = tasks.filter(task => task.completed).length;
        const remaining = tasks.length - completed;
        remainingLabel.textContent = `${remaining} ${remaining === 1 ? "left" : "left"}`;
        progressLabel.textContent = tasks.length ? `${completed} of ${tasks.length} done` : "All clear";
        emptyState.classList.toggle("visible", visibleTasks.length === 0);
        clearButton.disabled = completed === 0;
        document.querySelectorAll(".filter-button").forEach(button => {
          const selected = button.dataset.filter === filter;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
      }

      function toggleTask(id) {
        tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
        saveTasks();
        render();
      }

      function deleteTask(id, element) {
        element.classList.add("removing");
        window.setTimeout(() => {
          tasks = tasks.filter(task => task.id !== id);
          saveTasks();
          render();
        }, 210);
      }

      document.querySelector("#task-form").addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        tasks.unshift({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, text, completed: false });
        input.value = "";
        filter = "all";
        saveTasks();
        render();
        input.focus();
      });

      document.querySelectorAll(".filter-button").forEach(button => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          render();
        });
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "short", month: "short", day: "numeric"
      }).format(new Date());
      render();
    })();
  </script>
</body>
</html>
